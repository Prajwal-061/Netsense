<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetSense</title>
    <script>
      // Apply the saved theme before the first paint, so a light-theme user
      // never sees a dark flash. Storage can be unavailable (private window).
      try {
        if (localStorage.getItem('netsense-theme') === 'light') document.documentElement.dataset.theme = 'light'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
